# Запуск на сервере: docker compose -f docker-compose.prod.yml up -d
# Настройки берутся из файла .env рядом, см. docs/deploy.md
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: teamup
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "teamup"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://teamup:${POSTGRES_PASSWORD}@db:5432/teamup
    depends_on:
      db:
        condition: service_healthy

  # Бот в Max без вебхука. Включается так: docker compose -f docker-compose.prod.yml --profile bot up -d
  bot:
    build: .
    restart: unless-stopped
    profiles: [bot]
    command: ["npx", "tsx", "scripts/bot-poll.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://teamup:${POSTGRES_PASSWORD}@db:5432/teamup
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
