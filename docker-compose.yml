services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamup}
      POSTGRES_DB: teamup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
